<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D0121F" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#A60D18" stop-opacity="0.1" />
    </linearGradient>
    <pattern id="tiles" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFF7EA" stroke-opacity="0.08" stroke-width="1" />
    </pattern>
    <radialGradient id="creamGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#F2DDBC" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#F2DDBC" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="500" fill="#090807" />
  <rect width="1200" height="500" fill="url(#tiles)" />
  <circle cx="180" cy="30" r="250" fill="url(#redGlow)" />
  <circle cx="1050" cy="470" r="220" fill="url(#redGlow)" />

  <g transform="translate(80 70)">
